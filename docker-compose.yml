services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./CheckerServer
    ports:
      - "9090:9090"
      - "3002:3002"
    environment:
      MONGODB_URI: mongodb://mongo:27017/checker_db
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  mongo_data:
